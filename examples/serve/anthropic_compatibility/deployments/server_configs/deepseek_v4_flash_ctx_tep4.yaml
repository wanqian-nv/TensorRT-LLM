#
# DeepSeek-V4-Flash CONTEXT worker for 1P1D disaggregated serving: 4 GPUs as
# TEP4. Derived from deepseek_v4_flash_agg_tep4.yaml, which serves the same
# checkpoint aggregated; the differences are the cache transceiver, the
# generation-only settings that are dropped here, and a smaller KV fraction.
#
# This deployment exists to validate the disaggregated path itself on a
# checkpoint that is known to load. DeepSeek-V4-Pro was the intended first
# target and cannot be used yet: all three of its NVFP4 variants declare
# quant_algo MIXED_PRECISION in hf_quant_config.json, and
# modeling_deepseekv4.py asserts that the per-layer quant config is not
# MIXED_PRECISION -- it reads the global config rather than the per-layer table
# that _set_deepseek_v4_routed_moe_quant_config builds, so the assert fires
# before any weight is read. Flash carries its quantization inline in
# config.json as plain fp8 and never reaches that path.
#
# This worker only runs prefill: the proxy sends it request_type=context_only
# with stream=False and keeps nothing but choices[0].disaggregated_params. So
# no cuda_graph_config, no reasoning_parser, no tool_parser, no
# num_postprocess_workers.

allreduce_strategy: NCCL
context_parallel_size: 1

# No attention DP on the context side. With no decode steps there is no
# per-rank decode batch to balance, and TP prefill gives a single request the
# whole node -- which is what time-to-first-token depends on. It also keeps
# this worker away from _balance_adp_requests entirely.
# ON, following every reference recipe. Each rank owning its own requests
# and its own KV pool matters more than per-request prefill latency once
# several prompts are in flight. attention_dp_config.enable_balance is left
# unset (library default false) -- that flag, not attention DP itself, is
# what drove the SWA-scratch aborts on the aggregated deployment.
enable_attention_dp: true
attention_dp_config:
  # Route by prefix-match length alone. _score_rank is
  #   (req_tokens - match_len) + load_balance_weight * normalized_load
  # so weight 0 drops the load term entirely and the rank holding the longest
  # matching prefix wins outright. Ties -- every rank at match_len 0 on a cold
  # tree, for instance -- still fall to the least-loaded rank, which is a
  # hard-coded tie-break in the scoring loop, not a knob.
  enable_kv_cache_aware_routing: true
  kv_cache_routing_load_balance_weight: 0.0
  # Kept on. The first dp_size requests are round-robined by ascending rank
  # index without scoring at all, so every rank caches the shared system prompt
  # before scoring starts. Without it the first request seeds one rank, that
  # rank is then the only one with a nonzero match_len, and with the load term
  # gone nothing at all pulls traffic back to the others.
  kv_cache_routing_cold_start_warmup: true
  # match_rate_threshold (0.1) and fair_share_multiplier (2.0) are left at
  # their defaults deliberately -- stated here because this file used to pin
  # the multiplier to 1.5.

# NIXL for the KV handoff, and a buffer sized to the prefill chunk
# (max_num_tokens below), following slurm/benchmark/config.yaml. Both sides
# must declare the same backend and the same buffer.
cache_transceiver_config:
  backend: NIXL
  # PYTHON, not the "auto" default. auto adopts the model's preferred runtime
  # and otherwise falls back to the C++ transceiver, and DeepSeek-V4 declares
  # no transceiver preference -- so auto lands on BindKvCacheTransceiver, whose
  # binding signature takes bindings.internal.batch_manager.BaseKVCacheManager.
  # This model family cannot supply one: sparse_attention_config.algorithm
  # deepseek_v4 routes to DeepseekV4CacheManager, which subclasses
  # KVCacheManagerV2, and that choice never consults is_disagg. The result is
  #   TypeError: __init__(): incompatible function arguments
  # at startup (observed 08-18, job 504831).
  #
  # KvCacheTransceiverV2 is pure Python and dispatches on the manager type --
  # create_cache_reuse_adapter takes Union[KVCacheManager, KVCacheManagerV2] --
  # so it accepts what this model produces. It supports only NIXL and DEFAULT
  # backends, which is why NIXL above is load-bearing rather than incidental,
  # and it requires cp_size == 1, which context_parallel_size satisfies.
  transceiver_runtime: PYTHON
  # 10 minutes, matching every reference recipe. The 60s default is a
  # long-context hazard: a request whose KV does not finish moving in
  # time is cancelled, and these deployments carry ~1M-token contexts.
  kv_transfer_timeout_ms: 600000
  max_tokens_in_buffer: 8192

# The 2026-07-31 Flash release renumbered the reasoning-effort ladder, so the
# dated tokenizer alias is required; the plain deepseek_v4 alias encodes the
# earlier layout.
custom_tokenizer: deepseek_v4_20260731
# false, following every reference recipe. The earlier reasoning -- "prefill
# has nothing to overlap with" -- is wrong: overlap hides host-side request
# preparation behind the previous chunk's forward, and chunked prefill makes
# that a per-chunk win rather than a per-request one.
disable_overlap_scheduler: true
enable_autotuner: false
enable_chunked_prefill: true

kv_cache_config:
  # Inert as long as pool_ratio below is set: the whole avg_seq_len /
  # typical_step / warm-up constraints derivation is gated on
  # `if kv_cache_config.pool_ratio is None` (kv_cache_manager_v2.py), which
  # llm_args documents as "This does not take effect when pool_ratio is set."
  # Kept so the intended sequence length stays on the record, and so removing
  # pool_ratio restores a sized configuration rather than an unsized one.
  avg_seq_len: 262144
  dtype: fp8
  # Kept on. The aggregated deployment's traffic is Claude Code sessions whose
  # prompts share very long prefixes -- 54k-token prompts with a common system
  # block -- so prefix reuse on the context worker is worth more here than the
  # clean measurements the benchmark config gets by disabling it.
  enable_block_reuse: true
  # 0.85, the same as the generation side and as the other two disaggregated
  # deployments. This was 0.5 on the theory that a context worker hands its KV
  # away immediately and should leave the headroom to activations, but the
  # fraction does not multiply the card -- _cal_max_memory computes
  #   (total_gpu_memory - peak_memory + allocated_bytes) * fraction
  # so it only divides what is left *after* the profiled peak, which already
  # includes those activations. Measured on the Pro deployment at 0.85 (job
  # 513070): peak 243.05 GiB of 276.62, context KV quota 33.37 GiB, roughly 7.8M
  # tokens at 4474 bytes each. The 15% held back is runtime slack, not waste.
  free_gpu_memory_fraction: 0.85
  host_cache_size: 42949672960
  # DeepseekV4CacheManager only accepts 128 or 256.
  tokens_per_block: 128
  # Indexed by pool group, and the pool group index is the ascending sort of each
  # group's slot-size vector -- an emergent order, not a semantic one, and not
  # the order the roles are declared in. Verified end to end: the list is passed
  # through verbatim (kv_cache_manager_v2.py, initial_pool_ratio) and indexed
  # positionally in the C++ backend (storage/core.cpp, activeRatio[i] =
  # ratioList[activePgs[i]]), where the grouping is a sorted
  # std::map<std::vector<size_t>, ...> (storage/config.cpp). For this checkpoint:
  #
  #   [0] 0.55  COMPRESS + INDEXER_COMPRESS        non-sliding    0.63 MB/slot
  #   [1] 0.22  SWA + r128 COMPRESSOR_KV/SCORE     windowed      20.3 MB/slot
  #   [2] 0.23  r4 COMPRESSOR + INDEXER_COMPRESSOR windowed      39.3 MB/slot
  #
  # So 0.55 goes to COMPRESS, NOT to SWA, and "COMPRESSOR" is not one group: the
  # r128 compressor state shares [1] with SWA, only the r4 quad is [2]. Confirmed
  # against measurement -- the realised byte shares are 0.550/0.220/0.230, and the
  # observed slot counts are 38,638 / 437 / 235 per rank, which is why the summed
  # "free blocks" figure is ~98% group [0] and blind to the other two.
  #
  # Check the worker's own "DeepseekV4CacheManager role-to-pool/lifecycle mapping"
  # log line before touching these. The order is emergent, so it moves with the
  # layer mix, and TLLM_KV_CACHE_MANAGER_V2_BACKEND=python groups by insertion
  # order instead of sorted -- config.cpp says so in as many words.
  #
  # Locally tuned; no in-tree reference recipe sets pool_ratio at all (the only
  # guidance is blog26, "Users should therefore tune pool_ratio manually"). The
  # manager's own fallback derivation is ~[0.94, 0.02, 0.04], i.e. even more
  # group-[0]-heavy than this, so these values already concede budget to [1]/[2].
  pool_ratio: [0.55, 0.22, 0.23]
  event_buffer_max_size: 0

# 128, not 16. Measured on the Pro deployment (job 514107): eight concurrent
# 2026-token requests all finished within a 20.60-20.71s window with per-request
# TTFT at 20.6s against 343ms when sent alone, and the ctx GPU forward time was
# identical (9420.5ms) whether a request reused 19 KV blocks or 3 -- the prefill
# the router had saved was being spent waiting instead. The reference dep4-tep4
# recipe runs 128 here for the same reason.
#
# Back to 16. 128 was set off a synthetic test -- eight concurrent 2026-token
# requests, where raising it cut the ctx GPU forward time from 9420ms to 3239ms
# because the scheduler could finally interleave them across chunks. Real
# traffic is not that shape: a single Claude Code prompt runs to tens of
# thousands of tokens, and at 128 the scheduler admitted far more work per step
# than the startup profiling had measured. The MoE kernel then asked for
# 3.93 GiB with 709 MiB free and the rank died (job 525279, 22:08).
#
# The headroom is not recoverable by lowering free_gpu_memory_fraction either:
# _cal_max_memory splits what is left AFTER the profiled peak, so the KV pool
# is already committed by the time activations grow. Bounding the batch is what
# keeps the step within what profiling saw.
max_batch_size: 16
max_beam_width: 1
max_input_len: 1048575
max_num_tokens: 8192
max_seq_len: 1048576

moe_config:
  # TRTLLM, matching the framework's own AUTO choice for this
  # architecture on Blackwell and every reference recipe.
  backend: TRTLLM
moe_expert_parallel_size: 4

# Per-request timing and KV block counts, written straight to JSONL by the
# serving process (PerfMetricsJsonlWriter) and echoed on each response so the
# disaggregated proxy can file the joined ctx+gen record. The pull endpoint
# /perf_metrics that these settings used to feed no longer exists; serve.sh
# appends perf_metrics_output_dir per attempt, since only it knows the path.
# perf_metrics_max_requests went with the endpoint -- retention is the file now.
return_perf_metrics: true
pipeline_parallel_size: 1
print_iter_log: true
scheduler_config:
  capacity_scheduler_policy: MAX_UTILIZATION
  context_chunking_policy: EQUAL_PROGRESS
# No sparse_attention_config here. Every reference recipe declares it on the
# decode worker only: the context worker is driven with request_type
# context_only and its indexer state is rebuilt on the decode side anyway.
tensor_parallel_size: 4
trust_remote_code: true
