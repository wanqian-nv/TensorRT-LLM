#
# GLM-5.2-NVFP4 on 4 GPUs as DEP4: attention data-parallel, experts
# expert-parallel. The checkpoint is ~433 GiB, so TP4 puts ~109 GiB of weights
# on each GB300 and leaves ~128 GiB per rank for KV cache. Attention heads (64)
# and routed experts (256) both divide by 4, and the checkpoint routes with
# n_group=1, so EP4 imposes no group constraint.

allreduce_strategy: NCCL
context_parallel_size: 1

# Attention runs data-parallel: each rank owns its own requests and its own KV
# cache instead of every rank holding a replica. For an MLA checkpoint that is
# the difference between one shared 2.74M-token pool and four of them.
#
# Two consequences that shape everything below:
#   - max_batch_size and cuda_graph_config.batch_sizes become PER RANK. The
#     deployment guides put it as `concurrency = max_batch_size * num_gpus`.
#   - CUDA graphs need every rank to be generation-only in the same step
#     (cuda_graph_runner.py:302-309). One rank taking a prefill chunk drops the
#     whole step to eager, so graph coverage falls as prefill traffic rises.
enable_attention_dp: true
attention_dp_config:
  # OFF, matching the Flash deployment. Balancing was enabled here on the theory
  # that ranks drifting apart would let the slowest set the step time for all
  # four; that is real but secondary to what enabling it costs.
  #
  # _balance_adp_requests (py_executor.py:5142-5160, guarded at :5232 by this
  # flag) holds an already-scheduled context request by emptying the list, while
  # the V2 scheduler has already grown that request's KV capacity and nothing
  # reverts it. On the Flash deployment that desync aborts a rank through the
  # SWA-scratch assertion. GLM-5.2 is not known to be exposed -- its checkpoint
  # declares GlmMoeDsaForCausalLM, which resolves to a different cache-manager
  # family than kv_cache_manager_v2, and _revert_gen_alloc's own docstring notes
  # that only the V2 scheduler allocates before the can_queue check -- so this is
  # precautionary rather than a fix for an observed failure here.
  #
  # false is also the library default (llm_args.py:1384).
  enable_balance: false
  # Score each request by prefix match minus a load penalty, rather than
  # pinning whole conversations. Conversation affinity was tried first and is
  # the wrong granularity here: this deployment sees very few distinct sessions
  # (1207 audited requests covered 2), and affinity binds at session level, so
  # at most two of the four ranks can ever be bound. Its stickiness check uses
  # the hard cap (max_batch_size, 128) rather than any fair-share limit, so a
  # session running 80 concurrent requests never spills and the remaining ranks
  # serve only the ADP dummy.
  #
  # KV-cache-aware routing scores per request instead, so concurrent turns of
  # one session spread across ranks while still preferring a rank that already
  # holds the prefix. _score_rank measures both terms in tokens:
  #   (req_tokens - match_len) + load_balance_weight * normalized_load
  enable_kv_cache_aware_routing: true
  # Round-robin the first tp_size requests so every rank caches the shared
  # system prompt before scoring starts. Without it the first warm rank wins
  # every subsequent score and the concentration returns by another route.
  # Only worth enabling because these requests do share a long prefix.
  kv_cache_routing_cold_start_warmup: true
  # Tighter than the 2.0 default: a rank leaves the eligible set once it holds
  # 1.5x the fair share within a batch. This is the cap conversation affinity
  # lacked.
  kv_cache_routing_fair_share_multiplier: 1.5

cuda_graph_config:
  # Per rank, fine where the traffic is and coarse where it is not. Padding is
  # nearly free at the low end -- concurrency 3 padded to 4 measured 14.6ms
  # against 14.9ms for a real 4 -- so the small sizes exist to keep the padding
  # step short, not to avoid padding. Above 8 each padded slot is a phantom
  # sequence in an expensive step, which is why the spacing only widens
  # gradually.
  #
  # Reaching 128 matters because falling off the captured set is a cliff, not a
  # slope: measured on this deployment, a step cost 17.1ms at 8 and 152ms at 9.
  batch_sizes: [1, 2, 4, 8, 12, 16, 24, 32, 48, 64, 96, 128]
  enable_padding: true

disable_overlap_scheduler: true
enable_autotuner: false
enable_chunked_prefill: true

kv_cache_config:
  avg_seq_len: 262144
  dtype: fp8
  enable_block_reuse: true
  free_gpu_memory_fraction: 0.8
  host_cache_size: 42949672960
  tokens_per_block: 64

# Per rank, so 512 in flight across the four. Worth reading with the KV
# arithmetic: this checkpoint spends 50232 bytes per token, and 0.8 of the free
# memory buys a 2.74M-token pool per rank. That is 86k tokens per sequence at
# 32 per rank but only 21k at 128 -- less than one Claude Code session carries.
# The ceiling is therefore KV, not this number: raising it lets short sessions
# pack in, and long ones will still stall around 32-48 per rank.
max_batch_size: 128
max_beam_width: 1
max_input_len: 1048575
max_num_tokens: 8192
max_seq_len: 1048576

moe_config:
  # NVFP4 weights satisfy the CUTEDSL entry condition in create_moe.py, which
  # requires fp8 block scales or nvfp4. If the environment cannot serve the
  # backend it silently falls back to CutlassFusedMoE with a warning, so the
  # server log is the only place that confirms which one actually loaded.
  backend: CUTEDSL
moe_expert_parallel_size: 4

# Raised with max_batch_size: detokenisation is per response, and four workers
# that were comfortable at a dozen concurrent streams are not at hundreds.
num_postprocess_workers: 8
pipeline_parallel_size: 1
print_iter_log: true
reasoning_parser: deepseek-r1
scheduler_config:
  capacity_scheduler_policy: MAX_UTILIZATION
  context_chunking_policy: EQUAL_PROGRESS
sparse_attention_config:
  # Only enable_heuristic_topk is load-bearing here.
  #
  # `algorithm` is deliberately absent: model_config.py replaces whatever this
  # deployment passes with a freshly built DeepSeekSparseAttentionConfig for
  # GlmMoeDsaForCausalLM (and DeepseekV32ForCausalLM), and that class pins
  # `algorithm: Literal["dsa"]`. The value written here never reached the
  # dispatch in get_sparse_attn_kv_cache_manager -- which is why this
  # deployment logs "[KVCacheManager] blocks_per_window", the V1 manager, and
  # why tokens_per_block 64 is accepted at all; the V2 DeepseekV4CacheManager
  # only takes 128 or 256.
  #
  # `index_topk` is absent for the same reason index_topk is left unset on the
  # DeepSeek-V4 configs: the field is honoured only when explicitly set, so
  # omitting it takes the checkpoint's value. GLM-5.2 declares index_topk 2048
  # in its own config.json, alongside layer_types full of
  # deepseek_sparse_attention and an indexer_types map -- the checkpoint
  # describes its own sparse attention completely. Restating 2048 here matched
  # it exactly and so changed nothing, but it would pin the value across a
  # checkpoint that chose differently.
  #
  # The reference GLM recipes (209 of them, fp8 and nvfp4) set no
  # sparse_attention_config at all, which means they run with
  # enable_heuristic_topk at its False default. This deployment keeps it on.
  enable_heuristic_topk: true
stream_interval: 10
tensor_parallel_size: 4
trust_remote_code: true
