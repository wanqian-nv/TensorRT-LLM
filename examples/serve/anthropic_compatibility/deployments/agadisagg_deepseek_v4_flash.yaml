#
# DeepSeek-V4-Flash served DISAGGREGATED as 1P1D on two 4-GPU GB300 nodes:
# one context worker and one generation worker, each TEP4, behind a proxy.
#
#   ./serve.sh gateway --yaml deployments/agadisagg_deepseek_v4_flash.yaml
#   ./serve.sh submit  --yaml deployments/agadisagg_deepseek_v4_flash.yaml --label bringup
#
# Purpose: validate the disaggregated launch path end to end -- static url
# discovery, the proxy's startup wait, NIXL KV transfer, and the gateway relay
# in front of a proxy rather than a single server -- on a checkpoint that is
# known to load. DeepSeek-V4-Pro was the intended first target and is blocked
# on a framework issue: its NVFP4 variants declare quant_algo MIXED_PRECISION,
# which modeling_deepseekv4.py asserts against.
#
# Flash does not need disaggregation on its own merits -- 155 GiB of weights
# leave ~245 GiB per GPU for KV under TP4 -- so treat the numbers here as a
# functional check, not a performance claim.

# NOT "aga": the fleet directory is keyed on cluster_name + model.name, and
# aga_deepseek_v4_flash already belongs to the aggregated deployment. Sharing
# it would make the two register as backends of each other.
cluster_name: agadisagg
repo_dir: /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli/workspace/TensorRT-LLM

model:
  name: deepseek_v4_flash
  path: /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli/models/DeepSeek-V4-Flash-0731
  # Applied to the generation worker only.
  tool_parser: deepseek_v4

slurm:
  account: coreai_mlperf_inference
  partition: batch
  # interactive rather than normal: priority 700 against normal's 100, which
  # matters because two whole nodes must land at once. MaxTRESPU node=4 with
  # DenyOnLimit, so this deployment's 2 nodes leave room for one more.
  qos: interactive
  time: "4:00:00"
  nodes: 2
  gpus_per_node: 4
  extra_args: []

container:
  image: /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli/containers/trtllm-devel-sbsa-26.05-16194.sqsh
  mounts:
    - /scratch/fsw:/scratch/fsw
    - /lustre/fsw:/lustre/fsw

server:
  # The proxy port on the first allocated node; workers take 8334 and 8335 and
  # are never addressed by clients.
  port: 8333
  install_repo: true
  # GB300 NVL72 has two Grace sockets per node, and slurm/benchmark/config.yaml
  # turns numa_bind on for exactly this hardware.
  numactl: "0,1"
  capture: true
  extra_args: []
  env:
    TLLM_PROFILE_LOG_RANKS: all
    # No UCX_TLS. The reference recipes pin it to
    # "cuda_ipc,cuda_copy,sm,self,tcp", and copying that here broke NIXL
    # outright on this container (job 513029): UCX reported "4 NVIDIA GPU(s)
    # were detected, but UCX CUDA support was not found", then "VRAM memory is
    # detected as host by UCX", and NixlTransferAgent::registerMemory aborted on
    # status == NIXL_SUCCESS. Those recipes run nvcr.io/nvidia/tensorrt-llm/
    # release:1.3.0rc24; this deployment runs a locally built sbsa image whose
    # UCX does not accept that transport list. serve.sh unsets UCX_TLS instead,
    # which is the state the Flash disaggregated bring-up (job 505096) validated
    # end to end -- NIXL registered and a request completed.
  disagg:
    ctx:
      config: server_configs/deepseek_v4_flash_ctx_tep4.yaml
      instances: 1
    gen:
      config: server_configs/deepseek_v4_flash_gen_tep4.yaml
      instances: 1
    # The proxy sits in _wait_for_all_servers_ready for the whole of the
    # slowest worker's model load; the CLI default is 180s.
    # slurm/benchmark/start_server.sh uses 7200 for both -t and -r.
    start_timeout: 7200

trace:
  root: /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli/claude-traces

gateway:
  port: 8333
  account: coreai_mlperf_inference
  partition: cpu
  qos: cpu-long
  time: "7-00:00:00"
  users: gateway_users.txt
  # Longer than the aggregated Flash deployment's 1800: a disaggregated start
  # brings up three processes and the proxy only answers once both workers are
  # loaded.
  lead_time: 2700
  extra_args: ["--exclusive"]
