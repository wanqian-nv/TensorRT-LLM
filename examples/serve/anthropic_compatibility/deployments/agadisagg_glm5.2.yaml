#
# GLM-5.2-NVFP4 served DISAGGREGATED as 1P1D on two 4-GPU GB300 nodes: one
# context worker and one generation worker, each TEP4, behind a proxy.
#
#   ./serve.sh gateway --yaml deployments/agadisagg_glm5.2.yaml
#   ./serve.sh submit  --yaml deployments/agadisagg_glm5.2.yaml --label bringup
#
# This is aga_glm5.2.yaml with the disaggregated topology and the trace
# collection; the engine settings live in the two server_configs files, each of
# which is glm5.2_agg_tep4.yaml plus the transceiver and minus whatever belongs
# to the other phase.

# NOT "aga": the fleet directory is keyed on cluster_name + model.name, and
# aga_glm5.2 already belongs to the aggregated deployment. Sharing it would make
# the two register as backends of each other.
cluster_name: agadisagg
repo_dir: /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli/workspace/TensorRT-LLM

model:
  name: glm5.2
  path: /scratch/fsw/portfolios/coreai/projects/coreai_dlalgo_ci/artifacts/model/nvidia_glm-5.2-nvfp4/hf/hf-aec724e_orig
  # Applied to the generation worker only.
  tool_parser: glm47

slurm:
  account: coreai_mlperf_inference
  partition: batch
  # interactive rather than normal: priority 700 against normal's 100, which
  # matters because two whole nodes must land at once. The QoS caps at
  # MaxTRESPU node=4 with DenyOnLimit, so this deployment's 2 nodes leave room
  # for one more 2-node deployment and no more.
  qos: interactive
  time: "4:00:00"
  nodes: 2
  gpus_per_node: 4
  extra_args: []

container:
  image: /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli/containers/trtllm-devel-sbsa-26.05-16194.sqsh
  mounts:
    - /scratch/fsw:/scratch/fsw
    - /lustre/fsw:/lustre/fsw

server:
  # The proxy port on the first allocated node; the workers take 8335 and 8336
  # and are never addressed by clients. Unrelated to gateway.port below, which
  # lives on a CPU node.
  port: 8334
  install_repo: true
  # GB300 NVL72 has two Grace sockets per node, and the reference benchmark
  # config turns numa_bind on for exactly this hardware.
  numactl: "0,1"
  capture: true
  extra_args: []
  env:
    TLLM_PROFILE_LOG_RANKS: all
    # No UCX_TLS. The reference recipes pin it to
    # "cuda_ipc,cuda_copy,sm,self,tcp", and copying that here broke NIXL
    # outright on this container (job 513029): UCX reported "4 NVIDIA GPU(s)
    # were detected, but UCX CUDA support was not found", then "VRAM memory is
    # detected as host by UCX", and NixlTransferAgent::registerMemory aborted on
    # status == NIXL_SUCCESS. Those recipes run nvcr.io/nvidia/tensorrt-llm/
    # release:1.3.0rc24; this deployment runs a locally built sbsa image whose
    # UCX does not accept that transport list. serve.sh unsets UCX_TLS instead,
    # which is the state the Flash disaggregated bring-up (job 505096) validated
    # end to end -- NIXL registered and a request completed.
  disagg:
    ctx:
      config: server_configs/glm5.2_ctx_tep4.yaml
      instances: 1
    gen:
      config: server_configs/glm5.2_gen_tep4.yaml
      instances: 1
    # The proxy sits in _wait_for_all_servers_ready for the whole of the
    # slowest worker's model load; the CLI default is 180s, and the reference
    # start_server.sh uses 7200 for both -t and -r.
    start_timeout: 7200

trace:
  root: /scratch/fsw/portfolios/coreai/projects/coreai_mlperf_inference/users/serli/claude-traces

gateway:
  port: 8334
  account: coreai_mlperf_inference
  partition: cpu
  qos: cpu-long
  time: "7-00:00:00"
  users: gateway_users.txt
  # Longer than the aggregated deployment's 1800: a disaggregated start brings
  # up three processes, and the proxy only answers once both workers have
  # loaded 433 GiB of weights.
  lead_time: 2700
  extra_args: ["--exclusive"]
